version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eduverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduverse_admin
      POSTGRES_PASSWORD: eduverse_dev_password
      POSTGRES_DB: eduverse_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eduverse_admin -d eduverse_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

